<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LASU Navigator Admin</title>
  <style>
    :root { font-family: Arial, sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #1a233a; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08); margin-bottom: 16px; }
    h1, h2 { margin-top: 0; }
    input, textarea, select, button { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #d7deeb; margin-top: 8px; font-size: 1rem; }
    button { background: #0a5c2f; color: white; border: none; cursor: pointer; font-weight: 600; }
    button.secondary { background: #44546a; }
    button.danger { background: #c0392b; }
    .meta { color: #5d6b86; font-size: .9rem; margin-top: 6px; }
    .item { border: 1px solid #e6ebf5; border-radius: 10px; padding: 12px; margin-top: 10px; }
    .item strong { display: block; margin-bottom: 4px; }
    .item-actions { display: flex; gap: 8px; margin-top: 8px; }
    .item-actions button { padding: 8px; font-size: .85rem; margin-top: 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #e6ebf5; background: white; color: #5d6b86; font-weight: 600; cursor: pointer; font-size: .9rem; }
    .tab-btn.active { border-color: #0a5c2f; color: #0a5c2f; background: #f0fff4; }
    .section { display: none; }
    .section.active { display: block; }
    #gate-msg { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; color: #5d6b86; }
    .badge { background: #0a5c2f; color: white; border-radius: 20px; padding: 2px 8px; font-size: .75rem; margin-left: 6px; }
  </style>
</head>
<body>

  <div id="gate-msg">Verifying access...</div>

  <div class="wrap">
    <div id="admin-panel" style="display:none;">

      <!-- Header -->
      <div class="card">
        <h1>🛡️ LASU Navigator Admin</h1>
        <p class="meta">Signed in as <strong id="admin-user">...</strong></p>
        <p class="meta">Registered students: <strong id="student-count">...</strong></p>
        <button class="secondary" style="margin-top:12px" onclick="logoutAdmin()">🚪 Sign out</button>
      </div>

      <!-- Section Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchSection('announcements', event)">📢 Announcements</button>
        <button class="tab-btn" onclick="switchSection('schedules', event)">📅 Class Schedules</button>
      </div>

      <!-- ── Announcements Section ── -->
      <div id="section-announcements" class="section active">
        <div class="card">
          <h2>Post Announcement</h2>
          <input id="ann-title" placeholder="Announcement title" />
          <textarea id="ann-body" placeholder="Message body" rows="4"></textarea>
          <button onclick="postAnnouncement()" style="margin-top:12px">📢 Send to All Students</button>
        </div>
        <div class="card">
          <h2>Recent Announcements</h2>
          <div id="announcement-list"></div>
        </div>
      </div>

      <!-- ── Class Schedules Section ── -->
      <div id="section-schedules" class="section">
        <div class="card">
          <h2>Add Class Schedule</h2>
          <input id="sch-course" placeholder="Course name (e.g. CSC 401)" />
          <input id="sch-lecturer" placeholder="Lecturer name" />
          <div class="row">
            <select id="sch-day">
              <option value="">Select day</option>
              <option>Monday</option>
              <option>Tuesday</option>
              <option>Wednesday</option>
              <option>Thursday</option>
              <option>Friday</option>
              <option>Saturday</option>
            </select>
            <input id="sch-time" type="time" />
          </div>
          <input id="sch-venue" placeholder="Venue (e.g. LT1, Block C)" />
          <input id="sch-duration" placeholder="Duration (e.g. 2 hours)" />
          <button onclick="addSchedule()" style="margin-top:12px">📅 Add to Timetable</button>
        </div>
        <div class="card">
          <h2>Current Schedules</h2>
          <div id="schedule-list"></div>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import {
      getMyProfile,
      getAllStudents,
      getAnnouncements,
      postAnnouncement as postAnnouncementApi,
      deleteAnnouncement as deleteAnnouncementApi,
      getSchedules,
      postSchedule,
      deleteSchedule as deleteScheduleApi
    } from './api.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyB3e9pejY7EkDO8i5cZ7HX5KUmLGpBWdz8',
      authDomain: 'lasu-navigator.firebaseapp.com',
      projectId: 'lasu-navigator',
      storageBucket: 'lasu-navigator.firebasestorage.app',
      messagingSenderId: '128402428847',
      appId: '1:128402428847:web:eeee2966c791121829155a',
      measurementId: 'G-J0R6H1LBK4'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    async function ensureAdminAccess(user) {
      if (!user) {
        throw new Error('No authenticated user');
      }

      const profile = await getMyProfile();
      if (!profile || profile.role !== 'ADMIN') {
        throw new Error('Forbidden: admin role required');
      }

      return profile;
    }

    // ── Tab switching ─────────────────────────────────────────
    window.switchSection = (name, event) => {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('section-' + name).classList.add('active');
      if (event?.currentTarget) {
        event.currentTarget.classList.add('active');
      }
    };

    // ── Student count ─────────────────────────────────────────
    async function loadStudentCount() {
      const students = await getAllStudents();
      const el = document.getElementById('student-count');
      if (el) el.textContent = students ? students.length : 0;
    }

    // ── Announcements ─────────────────────────────────────────
    async function loadAnnouncements() {
      const list = document.getElementById('announcement-list');
      if (!list) return;

      try {
        const items = await getAnnouncements();
        if (!items || items.length === 0) {
          list.innerHTML = '<p class="meta">No announcements yet.</p>';
          return;
        }

        list.innerHTML = items.map(item => `
          <div class="item">
            <strong>${item.title || 'Untitled'}</strong>
            <div>${item.body || ''}</div>
            <div class="meta">By ${item.author_email || 'Admin'} · ${new Date(item.created_at || 0).toLocaleString()}</div>
            <div class="item-actions">
              <button class="danger" onclick="deleteAnnouncement('${item.id}')">🗑️ Delete</button>
            </div>
          </div>`).join('');
      } catch (error) {
        console.error('Failed to load announcements:', error);
        list.innerHTML = '<p class="meta">Unable to load announcements.</p>';
      }
    }

    window.postAnnouncement = async () => {
      const title = document.getElementById('ann-title').value.trim();
      const body = document.getElementById('ann-body').value.trim();
      if (!title || !body) { alert('Please enter both a title and a message.'); return; }

      try {
        await postAnnouncementApi(title, body);
        document.getElementById('ann-title').value = '';
        document.getElementById('ann-body').value = '';
        await loadAnnouncements();
        alert('✅ Announcement posted!');
      } catch (error) {
        console.error('Announcement post failed:', error);
        alert('❌ Failed to post announcement. Please try again.');
      }
    };

    window.deleteAnnouncement = async (id) => {
      if (!confirm('Delete this announcement?')) return;

      try {
        await deleteAnnouncementApi(id);
        await loadAnnouncements();
      } catch (error) {
        console.error('Delete announcement failed:', error);
        alert('❌ Failed to delete announcement.');
      }
    };

    // ── Class Schedules ───────────────────────────────────────
    async function loadSchedules() {
      const list = document.getElementById('schedule-list');
      if (!list) return;

      try {
        const items = await getSchedules();
        if (!items || items.length === 0) {
          list.innerHTML = '<p class="meta">No schedules yet.</p>';
          return;
        }

        list.innerHTML = items.map(item => `
          <div class="item">
            <strong>${item.course_code || item.course_name || 'Unnamed Course'}</strong>
            <div>👤 ${item.lecturer_name || '—'}</div>
            <div>📅 ${item.day_of_week || '—'} · ⏰ ${item.start_time || '—'} · ⏱ ${item.duration_hours || '—'} hours</div>
            <div>📍 ${item.venue || '—'}</div>
            <div class="item-actions">
              <button class="danger" onclick="deleteSchedule('${item.id}')">🗑️ Delete</button>
            </div>
          </div>`).join('');
      } catch (error) {
        console.error('Failed to load schedules:', error);
        list.innerHTML = '<p class="meta">Unable to load schedules.</p>';
      }
    }

    window.addSchedule = async () => {
      const course   = document.getElementById('sch-course').value.trim();
      const lecturer = document.getElementById('sch-lecturer').value.trim();
      const day      = document.getElementById('sch-day').value;
      const time     = document.getElementById('sch-time').value;
      const venue    = document.getElementById('sch-venue').value.trim();
      const duration = document.getElementById('sch-duration').value.trim();

      if (!course || !day || !time || !venue) {
        alert('Please fill in at least course, day, time and venue.');
        return;
      }

      try {
        await postSchedule({
          course_code: course,
          course_name: course,
          lecturer_name: lecturer,
          day_of_week: day,
          start_time: time,
          duration_hours: Number(duration) || 2,
          venue
        });

        ['sch-course','sch-lecturer','sch-venue','sch-duration'].forEach(id => {
          document.getElementById(id).value = '';
        });
        document.getElementById('sch-day').value = '';
        document.getElementById('sch-time').value = '';

        await loadSchedules();
        alert('✅ Schedule added successfully!');
      } catch (error) {
        console.error('Add schedule failed:', error);
        alert('❌ Failed to add schedule.');
      }
    };

    window.deleteSchedule = async (id) => {
      if (!confirm('Delete this schedule?')) return;

      try {
        await deleteScheduleApi(id);
        await loadSchedules();
      } catch (error) {
        console.error('Delete schedule failed:', error);
        alert('❌ Failed to delete schedule.');
      }
    };

    // ── Sign out ──────────────────────────────────────────────
    window.logoutAdmin = async () => {
      await signOut(auth);
      window.location.replace('login.html');
    };

    // ── Auth gate ─────────────────────────────────────────────
    onAuthStateChanged(auth, async (user) => {
      document.getElementById('gate-msg').style.display = 'none';
      if (!user) {
        window.location.replace('login.html');
        return;
      }

      try {
        const profile = await ensureAdminAccess(user);
        document.getElementById('admin-user').textContent = profile.email || user.email;
        document.getElementById('admin-panel').style.display = 'block';
        await loadStudentCount();
        await loadAnnouncements();
        await loadSchedules();
      } catch (error) {
        console.error('Admin access denied:', error);
        window.location.replace('index.html');
      }
    });
  </script>
</body>
</html>
